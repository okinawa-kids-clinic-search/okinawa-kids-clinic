const $=id=>document.getElementById(id);
function chips(el,arr,get,set){
  el.innerHTML="";
  arr.forEach(v=>{const b=document.createElement("button");b.textContent=v;
    if(get()===v)b.className="on";b.onclick=()=>{set(v);render()};el.appendChild(b)});
}
function add(p,tag,txt,cls,href){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;
  if(href){e.href=href;if(!href.startsWith("tel"))e.target="_blank";e.rel="noopener"}p.appendChild(e);return e}
function render(){
  chips($("depts"),DEPTS,()=>dept,v=>dept=v);
  chips($("areas"),AREAS,()=>area,v=>area=v);
  chips($("types"),TYPES,()=>type,v=>type=v);
  chips($("sps"),SPS,()=>sp,v=>sp=v);
  $("h").textContent="🏥 "+(area==="すべて"?"沖縄":"沖縄 "+area)+(dept==="すべて"?"":" "+dept)+" こどもの病院・クリニック検索";
  $("anote").textContent=area==="南部"?"※那覇市・豊見城・南風原・八重瀬・南城・糸満など":area==="離島"?"※宮古島・石垣島など":"";
  document.title=$("h").textContent.replace("🏥 ","");
  const q=$("q").value.trim();
  const r=DATA.filter(d=>(area==="すべて"||GRP[d.a]===area)&&(dept==="すべて"||(d.dp||["小児科"]).includes(dept))&&(type==="すべて"||d.t===type)&&(sp==="すべて"||(sp==="WEB予約あり"?(d.rs||[]).length>0:(d.sp||[]).includes(sp)))&&(!q||(d.n+d.a+d.c+d.t+(d.k||"")+(d.ad||"")).includes(q)));
  const L=$("list");L.innerHTML="";
  if(!r.length){add(L,"p","条件に合う施設がまだ載っていないよ🥲 条件をゆるめるか、#8000 も頼ってね","note")}
  const okd=d=>!!d.e||!!(d.h&&/[0-9]/.test(d.h))||!!(d.rc&&/[0-9]/.test(d.rc));
  const mk=(d,L)=>{
    const c=document.createElement("div");c.className="card";
    add(c,"h3",d.n);
    const g=document.createElement("div");
    add(g,"span",d.a+"エリア","tag");add(g,"span",d.t,"tag");if(d.e)add(g,"span","救急対応あり","tag e");;(d.dp||[]).forEach(x=>add(g,"span",x,"tag s"));(d.sp||[]).forEach(x=>add(g,"span",x,"tag s"));
    c.appendChild(g);
    if(d.fc)add(c,"p","🏷 "+d.fc.join(" ／ "),"note");
    add(c,"p","📍 "+d.c+(d.ad?" "+d.ad:"")+(d.k?"　🩺 "+d.k:""),"note");
    const inf=document.createElement("div");inf.className="info";
    const line=(l,v)=>{const x=document.createElement("div");x.textContent=l+"："+(v||"未確認（電話か公式サイトで確認してね）");if(!v)x.className="u";inf.appendChild(x)};
    if(d.t===C||d.h||d.off||d.rc){line("🕘 診療時間",d.h);line("🚫 休診日",d.off);line("📝 受付時間",d.rc);
      if(d.m&&(!d.mu||new Date()<=new Date(d.mu+"T23:59:59"))){const x=document.createElement("div");x.textContent="⚠️ "+d.m;x.className="m";inf.appendChild(x)}
      if(d.v){const x=document.createElement("div");x.textContent="確認日："+d.v.replace(/-/g,"/");x.className="v";inf.appendChild(x)}
      c.appendChild(inf)}
    const row=document.createElement("div");row.className="row";
    if(d.tel)add(row,"a","📞 "+d.tel,"btn","tel:"+d.tel.replace(/-/g,""));
    (d.rs||[]).forEach(r=>add(row,"a","📲 "+r[0],"btn",r[1]));
    if(d.w)add(row,"a","🌐 公式サイト","btn o",d.w);
    if(row.children.length)c.appendChild(row);
    L.appendChild(c);
  };
  const main=r.filter(okd),rest=r.filter(d=>!okd(d));
  main.forEach(d=>mk(d,L));
  if(rest.length){const dt=document.createElement("details");dt.className="more";if(main.length<5)dt.open=true;
    const sm=document.createElement("summary");sm.textContent="🔎 診療時間を確認中の施設（"+rest.length+"件）";dt.appendChild(sm);
    add(dt,"p","電話番号などは載せていますが、診療時間・休診日はこれから確認します。受診前に電話で確認してね。","note");
    rest.forEach(d=>mk(d,dt));L.appendChild(dt)}
}
