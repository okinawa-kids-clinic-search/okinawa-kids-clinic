@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10201f;--card:#182c2b;--tx:#e6f4f3;--sub:#93b3b1;--ac:#3cc9c4;--ac2:#ff9b7a;--bd:#2a4645}}
:root[data-theme="dark"]{--bg:#10201f;--card:#182c2b;--tx:#e6f4f3;--sub:#93b3b1;--ac:#3cc9c4;--ac2:#ff9b7a;--bd:#2a4645}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:0 0 4px}
.lead{color:var(--sub);font-size:.9rem;margin:0 0 16px}
.emg{background:#ffe9e2;color:#8a2b12;border-radius:12px;padding:10px 14px;font-size:.88rem;margin-bottom:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .emg{background:#3a2019;color:#ffc9b8}}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
input[type=search]{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.lbl{font-size:.75rem;color:var(--sub);margin:10px 0 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:1.02rem}
.tag{display:inline-block;font-size:.72rem;border-radius:6px;padding:1px 8px;margin-right:4px;background:var(--bg);border:1px solid var(--bd);color:var(--sub)}
.tag.s{border-color:var(--ac);color:var(--ac)}
.tag.e{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.note{color:var(--sub);font-size:.85rem;margin:6px 0 10px}
a.btn{display:inline-block;background:var(--ac);color:#fff;text-decoration:none;border-radius:10px;padding:8px 14px;font-size:.88rem}
a.btn.o{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.info{font-size:.85rem;margin:0 0 10px;padding:8px 10px;background:var(--bg);border-radius:10px}.info div{margin:2px 0}.info .u{color:var(--sub)}.info .m{color:var(--ac2)}.info .v{color:var(--sub);font-size:.75rem}
.foot{color:var(--sub);font-size:.78rem;margin-top:20px}
</style>
</head>
<body>
<main>
<h1 id="h">🏥 沖縄 こどもの病院・クリニック検索</h1>
<p class="lead">エリアや種類で、病院・クリニックを探せるよ🌺</p>
<div class="emg">🚑 <b>緊急時は119</b>／夜間・休日に迷ったら小児救急電話相談 <b>#8000</b> も使えるよ</div>

<div class="box">

<p class="note" id="anote" style="margin:8px 0 0"></p>
<p class="lbl">種類</p>
<div class="chips" id="types"></div>
<p class="lbl">得意・対応</p>
<div class="chips" id="sps"></div>
</div>

<div id="list"></div>

</main>

    const inf=document.createElement("div");inf.className="info";
    const line=(l,v)=>{const x=document.createElement("div");x.textContent=l+"："+(v||"未確認（電話か公式サイトで確認してね）");if(!v)x.className="u";inf.appendChild(x)};
    if(d.t===C||d.h||d.off||d.rc){line("🕘 診療時間",d.h);line("🚫 休診日",d.off);line("📝 受付時間",d.rc);
      if(d.m&&(!d.mu||new Date()<=new Date(d.mu+"T23:59:59"))){const x=document.createElement("div");x.textContent="⚠️ "+d.m;x.className="m";inf.appendChild(x)}
      if(d.v){const x=document.createElement("div");x.textContent="確認日："+d.v.replace(/-/g,"/");x.className="v";inf.appendChild(x)}
      c.appendChild(inf)}
    const row=document.createElement("div");row.className="row";
    if(d.tel)add(row,"a","📞 "+d.tel,"btn","tel:"+d.tel.replace(/-/g,""));
    (d.rs||[]).forEach(r=>add(row,"a","📲 "+r[0],"btn",r[1]));
    if(d.w)add(row,"a","🌐 公式サイト","btn o",d.w);
    if(row.children.length)c.appendChild(row);
    L.appendChild(c);
  });
}
$("chk").textContent="🗓 診療時間などの最終確認日："+(LAST_CHECKED||"未実施（月1回更新予定）");
$("q").oninput=render;render();
</script>
